spring.application.name=demo
# Keep user/password out of the JDBC URL so pooler usernames like postgres.<ref>
# and passwords with reserved URL characters are not truncated or misparsed.
# prepareThreshold=0: Supabase transaction pooler (PgBouncer :6543) does not
# keep server-side prepared statements across checkouts; without this, commits
# fail with "prepared statement \"S_1\" does not exist".
spring.datasource.url=jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres?prepareThreshold=0
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=SET TIMEZONE TO 'UTC';
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# JPA Properties
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialectorg.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jackson.deserialization.FAIL_ON_UNKNOWN_PROPERTIES=false
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=INFO
#logging.level.org.zalando.logbook=TRACE
spring.config.import=optional:file:.env[.properties]
discord.client.id=${VITE_DISCORD_CLIENT_ID}
discord.client.secret=${DISCORD_CLIENT_SECRET}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=604800000

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.picknroll.demo=INFO
spring.datasource.hikari.minimumIdle=1
spring.datasource.hikari.maximumPoolSize=2

# Caching (per-cache TTLs are set in CacheConfig)
spring.cache.type=caffeine
spring.cache.cache-names=livePlayerData,nbaSchedule
server.port=8080


